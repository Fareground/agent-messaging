name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # fg-agent-id is a runtime dependency not yet on PyPI, so it installs
      # from source, pinned to the release tag the pyproject constraint targets.
      # TODO: drop this line and let pip resolve from PyPI once fg-agent-id publishes.
      - run: pip install "fg-agent-id @ git+https://github.com/Fareground/agent-id.git@v0.2.0"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
