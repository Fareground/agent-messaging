name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # fg-agent-id is a runtime dependency and is not on PyPI, so it installs
      # from source before this package can resolve.
      - run: pip install "fg-agent-id @ git+https://github.com/Fareground/agent-id.git"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
