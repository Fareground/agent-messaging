[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fg-amp"
version = "0.11.0"
description = "Agent Messaging Protocol — agent-initiated, end-to-end-encrypted sessions between AI agents."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai", "agents", "messaging", "protocol", "encryption", "sessions", "a2a", "mcp"]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "fg-agent-id>=0.1",
    "pydantic>=2.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
http = ["fastapi>=0.110", "aiohttp>=3.9", "uvicorn[standard]>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "build>=1.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "aiohttp>=3.9",
    "hypothesis>=6.100",
]

[project.scripts]
amp-relay = "fg_amp.transport.relay:main"

[project.urls]
Repository = "https://github.com/Fareground/agent-messaging"

[tool.hatch.build.targets.wheel]
packages = ["src/fg_amp"]
artifacts = ["src/fg_amp/py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
